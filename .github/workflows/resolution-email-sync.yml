name: Resolution email sync (cron)

# Pulls new replies from each HD resolution case's linked Gmail thread into the
# portal, every ~30 minutes. The app runs NO scheduler, so this workflow is what
# actually calls src/app/api/cron/resolution-email-sync/route.ts in production.
# It is inert (the endpoint returns ok/skipped) until the Gmail integration is
# configured on Elastic Beanstalk (GMAIL_RESOLUTION_USER + read-only delegation
# on the existing Google service account).
#
# Setup (one-time):
#   1. Repo secret CRON_SECRET (Settings -> Secrets and variables -> Actions) must
#      match the CRON_SECRET env var on Elastic Beanstalk (same one the journal
#      sync uses). If they differ the endpoint returns 401.
#   2. (Optional) Repo variable PORTAL_BASE_URL to override the production URL.
#
# Run on demand any time from the Actions tab -> "Resolution email sync (cron)".

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes (UTC)
  workflow_dispatch: {}

concurrency:
  group: resolution-email-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call resolution-email-sync endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: ${{ vars.PORTAL_BASE_URL || 'https://portal.ghsbarrie.ca' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is not set. Add it under Settings -> Secrets and variables -> Actions. It must match the CRON_SECRET env var on Elastic Beanstalk."
            exit 1
          fi
          url="${BASE_URL%/}/api/cron/resolution-email-sync"
          echo "POST $url"
          code=$(curl -sS -o /tmp/body.txt -w '%{http_code}' -X POST "$url" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --retry 3 --retry-delay 5 --max-time 120 || echo "000")
          echo "HTTP status: $code"
          echo "Response body: $(cat /tmp/body.txt 2>/dev/null)"
          case "$code" in
            200) echo "Sweep started (or skipped — inert until Gmail is configured)." ;;
            401) echo "::error::401 Unauthorized - CRON_SECRET repo secret does not match the one on Elastic Beanstalk."; exit 1 ;;
            503) echo "::error::503 - CRON_SECRET is not configured on the Elastic Beanstalk environment."; exit 1 ;;
            000) echo "::error::Could not reach $url (network/DNS/timeout). Check PORTAL_BASE_URL."; exit 1 ;;
            *)   echo "::error::resolution-email-sync returned HTTP $code"; exit 1 ;;
          esac
