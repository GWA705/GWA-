name: Weekly funding report (cron)

# Calls src/app/api/cron/weekly-funding-report/route.ts in production on a schedule. The app
# runs NO in-app scheduler, so this GitHub Actions workflow is what drives it. This
# repo is public, so Actions minutes are free. Scheduled on a staggered minute so
# the portal's crons never all hit the single instance in the same second (which
# caused transient 504 gateway timeouts when several fired together on the hour).
#
# Needs repo secret CRON_SECRET (must match the EB env var). Optional repo variable
# PORTAL_BASE_URL overrides the production URL. Run on demand from the Actions tab.

on:
  schedule:
    - cron: '30 13 * * 1'   # Mondays 13:30 (UTC)
  workflow_dispatch: {}

concurrency:
  group: weekly-funding-report
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call weekly-funding-report endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: ${{ vars.PORTAL_BASE_URL || 'https://portal.ghsbarrie.ca' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is not set (Settings -> Secrets and variables -> Actions). It must match the CRON_SECRET env var on Elastic Beanstalk."
            exit 1
          fi
          url="${BASE_URL%/}/api/cron/weekly-funding-report"
          echo "POST $url"
          code=$(curl -sS -o /tmp/body.txt -w '%{http_code}' -X POST "$url" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --retry 3 --retry-delay 5 --max-time 120 || echo "000")
          echo "HTTP status: $code"
          echo "Response body: $(cat /tmp/body.txt 2>/dev/null)"
          case "$code" in
            200) echo "OK." ;;
            401) echo "::error::401 Unauthorized - CRON_SECRET repo secret does not match the one on Elastic Beanstalk."; exit 1 ;;
            503) echo "::error::503 - CRON_SECRET is not configured on Elastic Beanstalk."; exit 1 ;;
            000) echo "::error::Could not reach $url (network/DNS/timeout). Check PORTAL_BASE_URL."; exit 1 ;;
            *)   echo "::error::weekly-funding-report returned HTTP $code"; exit 1 ;;
          esac
