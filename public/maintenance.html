<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Back shortly — Georgian Water &amp; Air</title>
  <meta name="robots" content="noindex" />
  <!-- The app server is briefly unavailable (usually a deploy). Reload on a gentle
       cadence so the portal comes back on its own without the user doing anything. -->
  <meta http-equiv="refresh" content="20" />
  <style>
    :root {
      --ink: #1f2430;
      --muted: #6b7280;
      --line: #e5e7eb;
      --card: #ffffff;
      --bg1: #f4f6f8;
      --bg2: #e9edf1;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --ink: #f3f4f6; --muted: #9aa3af; --line: #2a2f3a;
        --card: #171a21; --bg1: #0f1116; --bg2: #171a21;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      background: radial-gradient(1200px 600px at 50% -10%, var(--bg2), var(--bg1));
      display: flex; align-items: center; justify-content: center;
      padding: 24px 16px; overflow: hidden;
    }
    /* Rising bubbles — a quiet nod to water & air, kept in greyscale so the logo
       stays the only colour on the page (brand kit: greyscale until palette is set). */
    .bubbles { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .bubble {
      position: absolute; bottom: -60px; border-radius: 50%;
      background: rgba(120,130,145,0.10);
      border: 1px solid rgba(120,130,145,0.18);
      animation: rise linear infinite;
    }
    @keyframes rise {
      0%   { transform: translateY(0) scale(0.9); opacity: 0; }
      10%  { opacity: 0.9; }
      100% { transform: translateY(-115vh) scale(1.1); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .bubble { animation: none; display: none; } }

    .card {
      position: relative; z-index: 1;
      width: 100%; max-width: 560px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 40px 28px 28px;
      box-shadow: 0 12px 40px rgba(20,30,50,0.10);
      text-align: center;
    }
    .logo { width: min(260px, 72%); height: auto; margin: 0 auto 22px; display: block; }
    .eyebrow {
      font-size: 12px; letter-spacing: 0.18em; font-weight: 800;
      color: var(--muted); text-transform: uppercase; margin: 0 0 10px;
    }
    h1 { font-size: 26px; line-height: 1.2; margin: 0 0 12px; font-weight: 800; }
    p { font-size: 16px; line-height: 1.6; color: var(--muted); margin: 0 auto 18px; max-width: 42ch; }
    .dots { display: inline-flex; gap: 6px; margin: 4px 0 20px; }
    .dots span {
      width: 8px; height: 8px; border-radius: 50%; background: var(--muted); opacity: 0.35;
      animation: blink 1.4s infinite both;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%,80%,100% { opacity: 0.25; } 40% { opacity: 0.9; } }
    @media (prefers-reduced-motion: reduce) { .dots span { animation: none; } }

    .btn {
      display: inline-block; cursor: pointer;
      background: var(--ink); color: var(--card);
      border: 0; border-radius: 12px;
      font-size: 15px; font-weight: 700; padding: 12px 22px;
      text-decoration: none;
    }
    .btn:active { transform: translateY(1px); }
    .foot {
      margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line);
      font-size: 13px; color: var(--muted); line-height: 1.7;
    }
    .foot a { color: var(--ink); text-decoration: none; font-weight: 600; }
    .foot .name { font-weight: 700; color: var(--ink); }
  </style>
</head>
