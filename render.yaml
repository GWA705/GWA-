# Render Blueprint — one-click-ish deploy of the GWA Credit Portal.
# Render reads this file to create a web service + a PostgreSQL database and
# wire them together. See docs/DEPLOY-RENDER.md for the step-by-step guide.
#
# IMPORTANT: This is a STAGING / DEMO setup for TEST DATA ONLY. The free tier
# hosts data in the US and uploaded files are not persistent. Do NOT enter real
# customer SINs or banking details here — see docs/COMPLIANCE.md before going
# live with real data in a Canadian region.

databases:
  - name: gwa-db
    databaseName: gwa
    plan: free
    region: oregon

services:
  - type: web
    name: gwa-portal
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    # Waits for the database, applies migrations, seeds, then starts (see script).
    startCommand: sh scripts/start.sh
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATABASE_URL
        fromDatabase:
          name: gwa-db
          property: connectionString
      # Auto-generated strong secrets — you never have to create these by hand.
      - key: SESSION_SECRET
        generateValue: true
      - key: MASTER_ENCRYPTION_KEY
        generateValue: true
      # File storage. The default (local disk at /tmp) is EPHEMERAL — uploads
      # are wiped on every redeploy — so it is for TEST DATA ONLY. Before real
      # customer documents, switch to S3 in ca-central-1 (Canada): set
      # STORAGE_DRIVER=s3 and the S3_* / AWS_* vars below in the Render
      # dashboard. Full walkthrough in docs/STORAGE-S3.md.
      - key: STORAGE_DRIVER
        value: local
      - key: LOCAL_STORAGE_DIR
        value: /tmp/storage
      # --- Production S3 storage (uncomment / set in dashboard to enable) ---
      # - key: STORAGE_DRIVER            # override the 'local' value above with 's3'
      #   value: s3
      # - key: S3_BUCKET
      #   sync: false                    # e.g. gwa-portal-documents
      # - key: S3_REGION
      #   value: ca-central-1
      # - key: S3_SSE
      #   value: AES256
      # - key: AWS_ACCESS_KEY_ID
      #   sync: false                    # least-privilege IAM user (see docs)
      # - key: AWS_SECRET_ACCESS_KEY
      #   sync: false
      - key: APP_URL
        sync: false # set to your Render URL after first deploy (optional)
      - key: SEED_ADMIN_EMAIL
        sync: false # set your real admin email in the dashboard
      - key: SEED_ADMIN_PASSWORD
        sync: false # set a strong password in the dashboard, or leave unset to
        # have the seed generate a random one (printed once in the deploy log).
        # Never commit a real/default admin password here.
