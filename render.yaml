# Render Blueprint — one-click-ish deploy of the GWA Credit Portal.
# Render reads this file to create a web service + a PostgreSQL database and
# wire them together. See docs/DEPLOY-RENDER.md for the step-by-step guide.
#
# DATA RESIDENCY: the database is hosted on AWS RDS in ca-central-1 (Canada)
# for PIPEDA residency — it is NOT managed by this Blueprint. DATABASE_URL is
# set in the Render dashboard (sync: false). Uploaded files also live in Canada
# via S3 ca-central-1 (docs/STORAGE-S3.md). The web service itself still runs in
# Render's Oregon region (Render has no Canadian region); sensitive DB fields
# (SIN, income, addresses) are application-encrypted at rest. See
# docs/COMPLIANCE.md.

services:
  - type: web
    name: gwa-portal
    runtime: node
    # Paid Standard plan (matches the live service): always-on (no free-tier
    # spin-down) with 2 GB RAM for image/PDF processing headroom.
    plan: standard
    region: oregon
    buildCommand: npm install && npm run build
    # Waits for the database, applies migrations, seeds, then starts (see script).
    startCommand: sh scripts/start.sh
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      # Display all dates/times in Eastern (Ontario business); Render runs in UTC.
      - key: TZ
        value: America/Toronto
      # External AWS RDS (ca-central-1) connection string — set in the dashboard.
      - key: DATABASE_URL
        sync: false
      # Auto-generated strong secrets — you never have to create these by hand.
      - key: SESSION_SECRET
        generateValue: true
      - key: MASTER_ENCRYPTION_KEY
        generateValue: true
      # File storage driver. Managed in the DASHBOARD (sync: false) so it can be
      # set to 's3' for production without a Blueprint sync reverting it to local.
      # If left unset the app defaults to local disk (/tmp) — TEST DATA ONLY,
      # since that is wiped on every redeploy. For production, set STORAGE_DRIVER=s3
      # plus the S3_* / AWS_* vars in the dashboard — walkthrough in
      # docs/STORAGE-S3.md. These storage vars are all dashboard-owned so the
      # Blueprint never clobbers a live production storage configuration.
      - key: STORAGE_DRIVER
        sync: false
      - key: LOCAL_STORAGE_DIR
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_SSE
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: APP_URL
        sync: false # set to your Render URL after first deploy (optional)
      - key: SEED_ADMIN_EMAIL
        sync: false # set your real admin email in the dashboard
      - key: SEED_ADMIN_PASSWORD
        sync: false # set a strong password in the dashboard, or leave unset to
        # have the seed generate a random one (printed once in the deploy log).
        # Never commit a real/default admin password here.
